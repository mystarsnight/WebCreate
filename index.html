<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Builder Pro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
}

/* TOP BAR */
#toolbar {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: #020617;
    align-items: center;
}

/* CANVAS */
#canvas {
    width: 100%;
    height: 85vh;
    background: #111827;
    position: relative;
    overflow: hidden;
}

/* ELEMENT */
.el {
    position: absolute;
    min-width: 50px;
    min-height: 50px;
    background: red;
    border: 2px solid transparent;
    cursor: move;
    user-select: none;
}

/* SELECTED */
.selected {
    border: 2px solid cyan;
}

/* RESIZE HANDLE */
.resize {
    width: 10px;
    height: 10px;
    background: white;
    position: absolute;
    right: 0;
    bottom: 0;
    cursor: se-resize;
}
</style>
</head>

<body>

<div id="toolbar">
    <button onclick="addBox()">Add Box</button>
    <button onclick="addText()">Add Text</button>

    <input type="color" id="colorPicker" onchange="setColor(this.value)">

    <input id="sitename" placeholder="site name">

    <button onclick="exportHTML()">Get HTML</button>
    <button onclick="publish()">Publish</button>
</div>

<div id="canvas"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const supabase = window.supabase.createClient(
    "YOUR_URL",
    "YOUR_ANON_KEY"
);

let selected = null;

/* ---------------- CREATE ELEMENTS ---------------- */

function createElement(type) {
    let el = document.createElement("div");
    el.className = "el";

    if (type === "text") {
        el.innerText = "Text";
        el.style.background = "transparent";
        el.style.color = "white";
    }

    el.style.left = "100px";
    el.style.top = "100px";
    el.style.width = "100px";
    el.style.height = "100px";

    enableDrag(el);
    enableSelect(el);
    enableResize(el);

    document.getElementById("canvas").appendChild(el);
}

function addBox() {
    createElement("box");
}

function addText() {
    createElement("text");
}

/* ---------------- SELECT ---------------- */

function enableSelect(el) {
    el.onclick = (e) => {
        e.stopPropagation();
        select(el);
    };
}

function select(el) {
    if (selected) selected.classList.remove("selected");
    selected = el;
    el.classList.add("selected");
}

/* deselect */
document.getElementById("canvas").onclick = () => {
    if (selected) selected.classList.remove("selected");
    selected = null;
};

/* ---------------- DRAG ---------------- */

function enableDrag(el) {
    el.onmousedown = function(e) {
        if (e.target.classList.contains("resize")) return;

        let offsetX = e.offsetX;
        let offsetY = e.offsetY;

        document.onmousemove = function(e) {
            el.style.left = (e.pageX - offsetX) + "px";
            el.style.top = (e.pageY - offsetY) + "px";
        };

        document.onmouseup = function() {
            document.onmousemove = null;
        };
    };
}

/* ---------------- RESIZE ---------------- */

function enableResize(el) {
    let handle = document.createElement("div");
    handle.className = "resize";
    el.appendChild(handle);

    handle.onmousedown = function(e) {
        e.stopPropagation();

        document.onmousemove = function(e) {
            el.style.width = e.pageX - el.offsetLeft + "px";
            el.style.height = e.pageY - el.offsetTop + "px";
        };

        document.onmouseup = function() {
            document.onmousemove = null;
        };
    };
}

/* ---------------- COLOR ---------------- */

function setColor(color) {
    if (!selected) return;
    selected.style.background = color;
}

/* ---------------- EXPORT HTML ---------------- */

function exportHTML() {
    let html = document.getElementById("canvas").innerHTML;
    console.log(html);
    alert("HTML copied to console!");
    return html;
}

/* ---------------- SUPABASE PUBLISH ---------------- */

async function publish() {
    let name = document.getElementById("sitename").value;
    let html = exportHTML();

    if (!name) return alert("Enter site name");

    let { error } = await supabase
        .from("sites")
        .insert([{ name, html }]);

    if (error) {
        alert("Name already exists or error");
    } else {
        alert("Published!");
    }
}

/* ---------------- LOAD SITE ---------------- */

async function loadSite(name) {
    let { data } = await supabase
        .from("sites")
        .select("*")
        .eq("name", name)
        .single();

    if (data) {
        document.getElementById("canvas").innerHTML = data.html;

        // re-enable interactions
        document.querySelectorAll(".el").forEach(el => {
            enableDrag(el);
            enableSelect(el);
            enableResize(el);
        });
    }
}

/* ---------------- URL SYSTEM ---------------- */

let params = new URLSearchParams(window.location.search);
let site = params.get("site");

if (site) loadSite(site);

</script>

</body>
</html>
