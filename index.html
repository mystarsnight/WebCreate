<script>
const supabase = window.supabase.createClient(
  "https://jsqciahlfzqywojpfvwg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzcWNpYWhsZnpxeXdvanBmdndnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjczOTEsImV4cCI6MjA5MzM0MzM5MX0.R1-5b5Os93YGEvpnhUGD9OLq1UXve319mQU0DeUf5ug"
);

let selected = null;
let history = [];
let redoStack = [];

/* ---------------- HISTORY ---------------- */

function saveState() {
    history.push(document.getElementById("canvas").innerHTML);
    redoStack = [];
}

/* ---------------- CREATE ---------------- */

function createElement(type) {
    saveState();

    const el = document.createElement("div");
    el.className = "el";

    el.style.left = "100px";
    el.style.top = "100px";

    if (type === "text") {
        el.classList.add("text");
        el.innerText = "Text";
        el.contentEditable = true;
        el.style.background = "transparent";
    }

    document.getElementById("canvas").appendChild(el);

    enableAll(el);
    updateLayers();
}

/* ---------------- BUTTONS ---------------- */

function addBox() {
    createElement("box");
}

function addText() {
    createElement("text");
}

/* ---------------- SELECT (FIXED) ---------------- */

function select(el) {
    if (selected) selected.classList.remove("selected");
    selected = el;
    el.classList.add("selected");

    document.getElementById("textInput").value = el.innerText || "";
}

/* ---------------- DRAG (FIXED SAFE SYSTEM) ---------------- */

function enableDrag(el) {
    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    el.addEventListener("mousedown", (e) => {
        if (e.target.classList.contains("resize")) return;
        if (el.isContentEditable) return;

        select(el);

        dragging = true;
        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;
    });

    window.addEventListener("mousemove", (e) => {
        if (!dragging) return;

        el.style.left = (e.clientX - offsetX) + "px";
        el.style.top = (e.clientY - offsetY) + "px";
    });

    window.addEventListener("mouseup", () => {
        dragging = false;
    });
}

/* ---------------- RESIZE (FIXED SAFE) ---------------- */

function enableResize(el) {
    const r = document.createElement("div");
    r.className = "resize";
    el.appendChild(r);

    let resizing = false;

    r.addEventListener("mousedown", (e) => {
        e.stopPropagation();
        resizing = true;
        select(el);
    });

    window.addEventListener("mousemove", (e) => {
        if (!resizing) return;

        el.style.width = Math.max(40, e.clientX - el.offsetLeft) + "px";
        el.style.height = Math.max(40, e.clientY - el.offsetTop) + "px";
    });

    window.addEventListener("mouseup", () => {
        resizing = false;
    });
}

/* ---------------- SELECT EVENTS ---------------- */

function enableSelect(el) {
    el.addEventListener("mousedown", () => {
        select(el);
    });
}

/* ---------------- MASTER ENABLE ---------------- */

function enableAll(el) {
    enableDrag(el);
    enableResize(el);
    enableSelect(el);
}

/* ---------------- PROPERTIES ---------------- */

function applyProps() {
    if (!selected) return;

    selected.innerText = document.getElementById("textInput").value;
    selected.style.background = document.getElementById("colorInput").value;
}

/* ---------------- LAYERS (FIXED) ---------------- */

function updateLayers() {
    const layers = document.getElementById("layers");
    layers.innerHTML = "";

    document.querySelectorAll(".el").forEach((el, i) => {
        const div = document.createElement("div");
        div.className = "layer";

        div.innerText = el.classList.contains("text")
            ? "Text " + i
            : "Box " + i;

        div.onclick = () => select(el);

        layers.appendChild(div);
    });
}

/* ---------------- EXPORT ---------------- */

function exportHTML() {
    let out = "";

    document.querySelectorAll(".el").forEach(el => {
        const style = `
position:absolute;
left:${el.style.left};
top:${el.style.top};
width:${el.style.width};
height:${el.style.height};
background:${el.style.background};
color:${el.style.color || "white"};
`;

        out += `<div style="${style}">${el.innerText}</div>`;
    });

    console.log(out);
    return out;
}

/* ---------------- PUBLISH ---------------- */

async function publish() {
    const name = document.getElementById("sitename").value;
    const html = exportHTML();

    if (!name) return alert("Enter name");

    const { error } = await supabase
        .from("sites")
        .insert([{ name, html }]);

    if (error) alert("Name already exists");
    else alert("Published!");
}

/* ---------------- LOAD ---------------- */

async function loadSite(name) {
    const { data } = await supabase
        .from("sites")
        .select("*")
        .eq("name", name)
        .single();

    if (data) {
        document.getElementById("canvas").innerHTML = data.html;

        document.querySelectorAll(".el").forEach(el => {
            enableAll(el);
        });

        updateLayers();
    }
}

/* ---------------- INIT ---------------- */

document.getElementById("canvas").addEventListener("mousedown", () => {
    if (selected) selected.classList.remove("selected");
    selected = null;
});

const params = new URLSearchParams(window.location.search);
const site = params.get("site");

if (site) loadSite(site);

</script>
