<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebCreate</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0a0f1f;
    color: white;
}

/* TOP BAR */
#toolbar {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: #020617;
    align-items: center;
}

/* CANVAS */
#canvas {
    width: 100%;
    height: 85vh;
    background: #111827;
    position: relative;
    overflow: hidden;
}

/* ELEMENT */
.el {
    position: absolute;
    width: 120px;
    height: 120px;
    background: #ef4444;
    cursor: move;
    user-select: none;
}

/* TEXT */
.text {
    background: transparent;
    color: white;
    font-size: 18px;
}

/* SELECTED */
.selected {
    outline: 2px solid #00ffff;
}

/* RESIZE HANDLE */
.resize {
    width: 10px;
    height: 10px;
    background: white;
    position: absolute;
    right: 0;
    bottom: 0;
    cursor: se-resize;
}
</style>
</head>

<body>

<div id="toolbar">
    <b>WebCreate</b>

    <button onclick="addBox()">Box</button>
    <button onclick="addText()">Text</button>

    <input type="color" id="colorPicker" onchange="changeColor(this.value)">

    <input id="sitename" placeholder="site name">

    <button onclick="exportHTML()">Get HTML</button>
    <button onclick="publish()">Publish</button>
</div>

<div id="canvas"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const supabase = window.supabase.createClient(
  "https://jsqciahlfzqywojpfvwg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzcWNpYWhsZnpxeXdvanBmdndnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjczOTEsImV4cCI6MjA5MzM0MzM5MX0.R1-5b5Os93YGEvpnhUGD9OLq1UXve319mQU0DeUf5ug"
);

let selected = null;

/* ---------------- CREATE ELEMENTS ---------------- */

function createElement(type) {
    let el = document.createElement("div");
    el.classList.add("el");

    if (type === "text") {
        el.classList.add("text");
        el.innerText = "Text";
        el.style.background = "transparent";
    }

    el.style.left = "100px";
    el.style.top = "100px";

    enableDrag(el);
    enableSelect(el);
    enableResize(el);

    document.getElementById("canvas").appendChild(el);
}

function addBox() {
    createElement("box");
}

function addText() {
    createElement("text");
}

/* ---------------- SELECT ---------------- */

function enableSelect(el) {
    el.onclick = (e) => {
        e.stopPropagation();
        if (selected) selected.classList.remove("selected");
        selected = el;
        el.classList.add("selected");
    };
}

document.getElementById("canvas").onclick = () => {
    if (selected) selected.classList.remove("selected");
    selected = null;
};

/* ---------------- DRAG ---------------- */

function enableDrag(el) {
    el.onmousedown = function(e) {
        if (e.target.classList.contains("resize")) return;

        let ox = e.offsetX;
        let oy = e.offsetY;

        document.onmousemove = function(e) {
            el.style.left = (e.pageX - ox) + "px";
            el.style.top = (e.pageY - oy) + "px";
        };

        document.onmouseup = () => {
            document.onmousemove = null;
        };
    };
}

/* ---------------- RESIZE ---------------- */

function enableResize(el) {
    let r = document.createElement("div");
    r.className = "resize";
    el.appendChild(r);

    r.onmousedown = function(e) {
        e.stopPropagation();

        document.onmousemove = function(e) {
            el.style.width = (e.pageX - el.offsetLeft) + "px";
            el.style.height = (e.pageY - el.offsetTop) + "px";
        };

        document.onmouseup = () => {
            document.onmousemove = null;
        };
    };
}

/* ---------------- COLOR CHANGE ---------------- */

function changeColor(color) {
    if (!selected) return;
    selected.style.background = color;
}

/* ---------------- EXPORT HTML ---------------- */

function exportHTML() {
    let html = document.getElementById("canvas").innerHTML;
    console.log(html);
    alert("HTML exported to console");
    return html;
}

/* ---------------- PUBLISH ---------------- */

async function publish() {
    let name = document.getElementById("sitename").value;
    let html = exportHTML();

    if (!name) return alert("Enter site name");

    let { error } = await supabase
        .from("sites")
        .insert([{ name, html }]);

    if (error) {
        alert("Name already exists");
    } else {
        alert("Published!");
    }
}

/* ---------------- LOAD SITE ---------------- */

async function loadSite(name) {
    let { data } = await supabase
        .from("sites")
        .select("*")
        .eq("name", name)
        .single();

    if (data) {
        document.getElementById("canvas").innerHTML = data.html;

        document.querySelectorAll(".el").forEach(el => {
            enableDrag(el);
            enableSelect(el);
            enableResize(el);
        });
    }
}

/* ---------------- URL SYSTEM ---------------- */

let params = new URLSearchParams(window.location.search);
let site = params.get("site");

if (site) loadSite(site);

</script>

</body>
</html>
